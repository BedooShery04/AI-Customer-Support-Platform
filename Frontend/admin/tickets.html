<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Manage all support tickets." />
        <title>All Tickets | Supportly</title>
        <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="../css/global.css" />
        <link rel="stylesheet" href="../css/tickets.css" />
    </head>
    <body data-page="admin-tickets" data-role="admin" data-nav="tickets" data-title="Tickets" data-eyebrow="Administration">
        <main id="page-content" class="main-content">
            <div class="page-heading"><div><h2>All tickets</h2><p id="admin-ticket-count">Loading all tickets…</p></div></div>
            <section class="content-card">
                <form id="admin-ticket-filters" class="filter-bar" aria-label="Filter all tickets">
                <label class="field"><span>Status</span><select name="status"></select></label>
                <label class="field"><span>Priority</span><select name="priority"></select></label>
                <label class="field"><span>Category</span><select name="category"></select></label>
                <label class="field"><span>Assigned Agent</span><select name="assignedAgentId"></select></label>
                <button class="button button--secondary button--small" type="reset">Clear filters</button>
                </form>
                <div id="admin-tickets-table"></div>
            </section>
        </main>
        <script type="module" src="../js/app.js"></script>
    </body>
</html>
