<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Support system statistics." />
        <title>Statistics | Supportly</title>
        <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="../css/global.css" />
        <link rel="stylesheet" href="../css/dashboard.css" />
    </head>
    <body data-page="admin-statistics" data-role="admin" data-nav="statistics" data-title="Statistics" data-eyebrow="Administration">
        <main id="page-content" class="main-content">
            <div class="page-heading"><div><h2>Ticket statistics</h2><p>Distribution and assignment data from the support system.</p></div></div>
            <section id="statistics-cards" class="stats-grid stats-grid--five" aria-label="Ticket statistics"></section>
            <section class="content-card average-card"><span>Average Tickets Per Category</span><strong id="average-per-category">—</strong></section>
            <div class="dashboard-grid dashboard-grid--equal statistics-grid">
                <section class="content-card"><div class="card-header"><div><h2>Tickets by Category</h2><p>Current category distribution</p></div></div><div id="category-chart" class="card-body"></div></section>
                <section class="content-card"><div class="card-header"><div><h2>Tickets by Status</h2><p>Current workflow distribution</p></div></div><div id="status-chart" class="card-body"></div></section>
                <section class="content-card dashboard-span-full"><div class="card-header"><div><h2>Tickets Assigned to Agents</h2><p>Current ticket assignment workload</p></div></div><div id="agent-chart" class="card-body"></div></section>
            </div>
        </main>
        <script type="module" src="../js/app.js"></script>
    </body>
</html>
