<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Administrative support dashboard." />
        <title>Admin Dashboard | Supportly</title>
        <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="../css/global.css" />
        <link rel="stylesheet" href="../css/dashboard.css" />
    </head>
    <body data-page="admin-dashboard" data-role="ADMIN" data-nav="dashboard" data-title="Dashboard" data-eyebrow="Administration">
        <main id="page-content" class="main-content">
            <div class="page-heading"><div><h2>System overview</h2><p>Monitor tickets, support activity, and AI usage.</p></div></div>
            <section id="admin-stats" class="stats-grid stats-grid--five" aria-label="System ticket statistics"></section>
            <div class="dashboard-grid dashboard-grid--equal">
                <section class="content-card dashboard-span-full"><div class="card-header"><div><h2>Recent tickets</h2><p>Latest updates across the support system</p></div><a class="table-link" href="tickets.html">View all</a></div><div id="admin-recent-tickets"></div></section>
                <section class="content-card"><div class="card-header"><div><h2>Support activity overview</h2><p>Tickets currently assigned to agents</p></div></div><div id="support-activity" class="card-body"></div></section>
                <section class="content-card"><div class="card-header"><div><h2>AI usage & activity</h2><p>AI-assisted ticket activity</p></div></div><div id="ai-activity" class="card-body"></div></section>
            </div>
        </main>
        <script type="module" src="../js/app.js"></script>
    </body>
</html>
