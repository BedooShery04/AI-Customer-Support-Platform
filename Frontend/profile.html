
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Profile | Supportly</title>

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/profile.css" />
</head>

<body
    data-page="my-profile"
    data-nav="profile"
    data-title="My Profile"
    data-eyebrow="ACCOUNT SETTINGS"
>
    <main id="page-content" class="main-content">
        <section class="page-section profile-page">

            <div class="page-heading">
                <div>
                    <h2>My Profile</h2>
                    <p>View and manage your account information.</p>
                </div>
            </div>

            <section class="content-card profile-card">

                <div class="profile-header">
                    <div
                        id="profile-avatar"
                        class="avatar profile-avatar"
                        aria-hidden="true"
                    ></div>

                    <div>
                        <h2 id="profile-name">Loading...</h2>
                        <p id="profile-email"></p>
                        <span id="profile-role" class="profile-role"></span>
                    </div>
                </div>

                <div class="profile-section-heading">
                    <div>
                        <h2>Personal Information</h2>
                        <p>Update your name and email address.</p>
                    </div>
                </div>

                <form id="profile-form" novalidate>

                    <p
                        id="profile-message"
                        class="form-alert hidden"
                        role="status"
                        aria-live="polite"
                    ></p>

                    <div class="profile-grid">

                        <label class="field">
                            <span>Full Name</span>

                            <input
                                type="text"
                                name="name"
                                autocomplete="name"
                                minlength="2"
                                maxlength="100"
                                required
                            />

                            <small
                                class="field-error"
                                data-error-for="name"
                            ></small>
                        </label>

                        <label class="field">
                            <span>Email Address</span>

                            <input
                                type="email"
                                name="email"
                                autocomplete="email"
                                required
                            />

                            <small
                                class="field-error"
                                data-error-for="email"
                            ></small>
                        </label>

                        <div class="profile-info-field">
                            <span>Account Role</span>
                            <strong id="profile-info-role">—</strong>
                        </div>

                        <div class="profile-info-field">
                            <span>Account Status</span>
                            <strong id="profile-status">—</strong>
                        </div>

                        <div class="profile-info-field">
                            <span>Member Since</span>
                            <strong id="profile-created">—</strong>
                        </div>

                    </div>

                    <div class="profile-actions">
                        <button
                            type="reset"
                            class="button button--secondary"
                        >
                            Cancel Changes
                        </button>

                        <button
                            type="submit"
                            class="button button--primary"
                        >
                            Save Changes
                        </button>
                    </div>

                </form>
            </section>

        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>

</html>
