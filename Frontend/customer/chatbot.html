<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="AI customer support chat interface." />
        <title>AI Chatbot | Supportly</title>
        <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="/css/global.css" />
        <link rel="stylesheet" href="/css/chatbot.css" />
    </head>
    <body data-page="customer-chatbot" data-role="CUSTOMER" data-nav="chatbot" data-title="AI Chatbot" data-eyebrow="Customer workspace">
        <main id="page-content" class="main-content chat-page">
            <div class="page-heading"><div><h2>Hi, <span data-chat-customer>Customer</span></h2><p>Ask a general support question or check information about your tickets.</p></div></div>
            <section class="chat-shell" aria-label="AI support conversation">
                <div class="chat-header"><div class="chat-avatar" aria-hidden="true"><span></span><span></span></div><div><h2>AI Support Assistant</h2><p>Backend-connected; development mode is labeled in replies</p></div></div>
                <div id="chat-history" class="chat-history" aria-live="polite"></div>
                <p id="chat-error" class="chat-error hidden" role="alert"></p>
                <form id="chat-form" class="chat-composer" novalidate>
                    <label class="field"><span class="sr-only">Your message</span><textarea name="message" rows="1" placeholder="Ask a support question…" required></textarea></label>
                    <button class="button button--primary" type="submit">Send</button>
                </form>
            </section>
        </main>
        <script type="module" src="/js/app.js"></script>
    </body>
</html>
