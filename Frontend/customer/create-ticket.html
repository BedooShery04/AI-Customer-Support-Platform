<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Create a customer support ticket." />
        <title>Create Ticket | Supportly</title>
        <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="../css/global.css" />
        <link rel="stylesheet" href="../css/tickets.css" />
    </head>
    <body data-page="customer-create-ticket" data-role="customer" data-nav="create-ticket" data-title="Create Ticket" data-eyebrow="Customer workspace">
        <main id="page-content" class="main-content">
            <div class="page-heading"><div><h2>Create a support ticket</h2><p>Describe the issue clearly so the support team can help.</p></div></div>
            <section class="content-card form-card">
                <div class="card-header"><div><h2>Ticket information</h2><p>All fields are required</p></div></div>
                <div class="card-body">
                <form id="create-ticket-form" class="form-grid" novalidate>
                    <div class="form-alert hidden" data-form-message role="alert"></div>
                    <label class="field field--full"><span>Subject</span><input type="text" name="subject" maxlength="120" placeholder="Briefly summarize the issue" required aria-invalid="false" /><small class="field-error" data-error-for="subject"></small></label>
                    <label class="field field--full"><span>Description</span><textarea name="description" maxlength="2000" placeholder="Explain what happened, what you expected, and any relevant details" required aria-invalid="false"></textarea><small class="field-error" data-error-for="description"></small></label>
                    <label class="field"><span>Category</span><select name="category" required aria-invalid="false"></select><small class="field-error" data-error-for="category"></small></label>
                    <label class="field"><span>Priority</span><select name="priority" required aria-invalid="false"></select><small class="field-error" data-error-for="priority"></small></label>
                    <div class="form-actions"><a class="button button--secondary" href="tickets.html">Cancel</a><button class="button button--primary" type="submit">Create Ticket</button></div>
                </form>
                </div>
            </section>
        </main>
        <script type="module" src="../js/app.js"></script>
    </body>
</html>
