<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Support agent dashboard." />
        <title>Agent Dashboard | Supportly</title>
        <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="../css/global.css" />
        <link rel="stylesheet" href="../css/dashboard.css" />
        <link rel="stylesheet" href="../css/tickets.css" />
    </head>
    <body data-page="agent-dashboard" data-role="agent" data-nav="dashboard" data-title="Dashboard" data-eyebrow="Support workspace">
        <main id="page-content" class="main-content">
            <section class="welcome-panel"><div><h2>Good to see you, <span data-agent-name>Agent</span></h2><p>Review your assigned queue and continue active conversations.</p></div><a class="button" href="assigned-tickets.html">Open assigned tickets</a></section>
            <section id="agent-stats" class="stats-grid stats-grid--five" aria-label="Assigned ticket statistics"></section>
            <section class="content-card">
                <div class="card-header"><div><h2>Recent assigned tickets</h2><p>Your most recently updated support requests</p></div><a class="table-link" href="assigned-tickets.html">View all</a></div>
                <div id="recent-assigned-tickets"></div>
            </section>
        </main>
        <script type="module" src="../js/app.js"></script>
    </body>
</html>
