<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Tickets assigned to the logged-in support agent." />
        <title>Assigned Tickets | Supportly</title>
        <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="../css/global.css" />
        <link rel="stylesheet" href="../css/tickets.css" />
    </head>
    <body data-page="agent-assigned-tickets" data-role="agent" data-nav="assigned-tickets" data-title="Assigned Tickets" data-eyebrow="Support workspace">
        <main id="page-content" class="main-content">
            <div class="page-heading"><div><h2>Assigned Tickets</h2><p id="assigned-ticket-count">Loading assigned tickets…</p></div></div>
            <section class="content-card">
                <form id="ticket-filters" class="filter-bar" aria-label="Filter assigned tickets">
                    <label class="field"><span>Status</span><select name="status"></select></label>
                    <label class="field"><span>Priority</span><select name="priority"></select></label>
                    <label class="field"><span>Category</span><select name="category"></select></label>
                    <button class="button button--secondary button--small" type="reset">Clear filters</button>
                </form>
                <div id="assigned-tickets-table"></div>
            </section>
        </main>
        <script type="module" src="../js/app.js"></script>
    </body>
</html>
