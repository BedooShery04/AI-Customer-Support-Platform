<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <meta
            name="description"
            content="AI Assistant for support agents."
        />

        <title>AI Assistant | Supportly</title>

        <link
            rel="icon"
            href="../assets/favicon.svg"
            type="image/svg+xml"
        />

        <link rel="stylesheet" href="../css/global.css" />
        <link rel="stylesheet" href="../css/dashboard.css" />
        <link rel="stylesheet" href="../css/tickets.css" />
        <link rel="stylesheet" href="../css/chatbot.css" />
    </head>

    <body
        data-page="agent-ai-assistant"
        data-role="agent"
        data-nav="ai-assistant"
        data-title="AI Assistant"
        data-eyebrow="Support workspace"
    >
        <main id="page-content" class="main-content">

            <div class="chat-page">
                <section class="chat-shell">

                    <header class="chat-header">
                        <div class="chat-avatar" aria-hidden="true">
                            <span></span>
                            <span></span>
                        </div>

                        <div>
                            <h2>AI Assistant</h2>
                            <p>Available to help with support tasks</p>
                        </div>
                    </header>

                    <div
                        id="agent-chat-history"
                        class="chat-history"
                        aria-live="polite"
                    ></div>

                    <p
                        id="agent-chat-error"
                        class="chat-error hidden"
                        role="alert"
                    ></p>

                    <form
                        id="agent-chat-form"
                        class="chat-composer"
                    >
                        <div class="field">
                            <textarea
                                name="message"
                                rows="2"
                                placeholder="Ask the AI assistant..."
                                required
                            ></textarea>
                        </div>

                        <button
                            type="submit"
                            class="button"
                        >
                            Send
                        </button>
                    </form>

                </section>
            </div>

        </main>

        <script
            type="module"
            src="../js/app.js"
        ></script>
    </body>
</html>
